<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#059669">
  <title>Changuito Ahorro - Vital / Nini</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg: #0b1329;
      --card-bg: #1e293b;
      --card-border: #334155;
      --primary: #10b981;
      --primary-hover: #059669;
      --accent: #38bdf8;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 120px;
      user-select: none;
    }

    /* Header & Budget Dashboard */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(11, 19, 41, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      padding: 12px 16px 8px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .title-group h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-market {
      background: #065f46;
      color: #6ee7b7;
      font-size: 0.68rem;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
    }

    .budget-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 8px 12px;
      display: grid;
      grid-template-columns: 1fr 1.1fr 1fr;
      gap: 6px;
      text-align: center;
    }

    .budget-col {
      display: flex;
      flex-direction: column;
    }

    .budget-label {
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
    }

    .budget-val {
      font-size: 0.95rem;
      font-weight: 700;
      margin-top: 2px;
    }

    .val-spent { color: var(--accent); }
    .val-budget { color: #cbd5e1; cursor: pointer; }
    .val-remain { color: var(--primary); }
    .val-remain.danger { color: var(--danger); }

    .progress-track {
      width: 100%;
      height: 5px;
      background: #334155;
      border-radius: 99px;
      margin-top: 8px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Category Navigation */
    .cat-nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 16px 4px;
      scrollbar-width: none;
    }
    .cat-nav::-webkit-scrollbar { display: none; }

    .cat-btn {
      flex-shrink: 0;
      background: #1e293b;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }

    .cat-btn.active {
      background: var(--primary);
      color: #064e3b;
      border-color: var(--primary);
      font-weight: 700;
    }

    /* Items List */
    .list-container {
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Item Card */
    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .item-card.checked {
      background: #131d31;
      border-color: #1e293b;
      opacity: 0.7;
    }

    .card-top {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .custom-check {
      width: 26px;
      height: 26px;
      min-width: 26px;
      border-radius: 8px;
      border: 2px solid #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .item-card.checked .custom-check {
      background: var(--primary);
      border-color: var(--primary);
      color: #064e3b;
    }

    .item-title-box {
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }

    .item-name-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .item-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
    }

    .item-card.checked .item-name {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .item-sub {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .btn-edit {
      background: #334155;
      border: none;
      color: #94a3b8;
      border-radius: 6px;
      padding: 3px 6px;
      font-size: 0.72rem;
      cursor: pointer;
    }

    /* Calculator Controls row (Quantity & Unit Price) */
    .calc-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0f172a;
      border-radius: 8px;
      padding: 6px 8px;
      gap: 8px;
    }

    .qty-control {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-qty {
      width: 26px;
      height: 26px;
      background: #334155;
      border: none;
      color: #fff;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .btn-qty:active { background: var(--primary); color: #000; }

    .qty-display {
      font-size: 0.85rem;
      font-weight: 700;
      min-width: 24px;
      text-align: center;
      color: #e2e8f0;
    }

    .unit-price-box {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .unit-price-box label {
      font-size: 0.65rem;
      color: var(--text-muted);
    }

    .unit-input {
      width: 72px;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 6px;
      color: #38bdf8;
      font-size: 0.82rem;
      font-weight: 700;
      text-align: right;
      padding: 4px;
    }
    .unit-input:focus { outline: none; border-color: var(--accent); }

    .subtotal-tag {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--primary);
      white-space: nowrap;
    }

    /* Bottom Action Bar */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--card-border);
      padding: 10px 16px;
      display: flex;
      gap: 10px;
      z-index: 100;
    }

    .btn-action {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary { background: var(--primary); color: #064e3b; }
    .btn-whatsapp { background: #25d366; color: #064e3b; }

    /* Modal Sheet */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 200;
    }

    .modal-sheet {
      background: var(--card-bg);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 18px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 -10px 25px rgba(0,0,0,0.5);
    }

    .modal-sheet h2 {
      font-size: 1.1rem;
      margin-bottom: 12px;
      color: #fff;
    }

    .form-group {
      margin-bottom: 10px;
    }

    .form-group label {
      display: block;
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-bottom: 3px;
      font-weight: 600;
    }

    .form-control {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 9px;
      color: #fff;
      font-size: 0.9rem;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .modal-btns {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .btn-cancel {
      flex: 1;
      background: #334155;
      color: #cbd5e1;
      border: none;
      padding: 10px;
      border-radius: 10px;
      font-weight: 600;
    }

    .btn-delete-modal {
      background: #7f1d1d;
      color: #fca5a5;
      border: none;
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Sticky Header -->
  <header>
    <div class="header-top">
      <div class="title-group">
        <h1>🛒 Changuito Ahorro</h1>
        <span class="badge-market">VITAL / NINI</span>
      </div>
      <div style="font-size: 0.72rem; color: #94a3b8;" id="item-stats">0/0 en chango</div>
    </div>

    <!-- Live Budget Dashboard -->
    <div class="budget-card">
      <div class="budget-col">
        <span class="budget-label">Presupuesto</span>
        <span class="budget-val val-budget" id="display-budget" onclick="editBudget()">$350.000 ✏️</span>
      </div>
      <div class="budget-col">
        <span class="budget-label">En Chango</span>
        <span class="budget-val val-spent" id="display-spent">$0</span>
      </div>
      <div class="budget-col">
        <span class="budget-label">Restante</span>
        <span class="budget-val val-remain" id="display-remain">$350.000</span>
      </div>
    </div>

    <div class="progress-track">
      <div class="progress-fill" id="progress-bar"></div>
    </div>
  </header>

  <!-- Categories Navigation -->
  <div class="cat-nav">
    <button class="cat-btn active" onclick="filterCat('todos', this)">Todos</button>
    <button class="cat-btn" onclick="filterCat('almacen', this)">Almacén</button>
    <button class="cat-btn" onclick="filterCat('conservas', this)">Conservas</button>
    <button class="cat-btn" onclick="filterCat('limpieza', this)">Limpieza</button>
    <button class="cat-btn" onclick="filterCat('perfumeria', this)">Perfumería</button>
    <button class="cat-btn" onclick="filterCat('frescos', this)">Lácteos/Frescos</button>
  </div>

  <!-- Items List Container -->
  <div class="list-container" id="items-list"></div>

  <!-- Bottom Floating Actions -->
  <div class="bottom-bar">
    <button class="btn-action btn-primary" onclick="openCreateModal()">
      <span>➕</span> Nuevo Producto
    </button>
    <button class="btn-action btn-whatsapp" onclick="shareWhatsApp()">
      <span>📲</span> WhatsApp
    </button>
  </div>

  <!-- Add / Edit Item Modal Sheet -->
  <div class="modal-overlay" id="item-modal" onclick="closeModal(event)">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <h2 id="modal-title">Editar Producto</h2>
      <input type="hidden" id="modal-item-id">

      <div class="form-group">
        <label>Nombre del producto (ej. Fideos Capelettinis, Aceite Girasol)</label>
        <input type="text" id="modal-name" class="form-control">
      </div>

      <div class="form-group">
        <label>Detalle / Variedad / Marca</label>
        <input type="text" id="modal-detail" class="form-control" placeholder="Ej. Tirabuzón, o marca Canale">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Cantidad (unidades)</label>
          <input type="number" id="modal-qty" class="form-control" min="1" value="1">
        </div>
        <div class="form-group">
          <label>Precio por unidad ($)</label>
          <input type="number" id="modal-price" class="form-control" placeholder="Ej. 1100">
        </div>
      </div>

      <div class="form-group">
        <label>Categoría</label>
        <select id="modal-cat" class="form-control">
          <option value="almacen">Almacén</option>
          <option value="conservas">Conservas / Enlatados</option>
          <option value="limpieza">Limpieza</option>
          <option value="perfumeria">Perfumería / Higiene</option>
          <option value="frescos">Lácteos y Frescos</option>
        </select>
      </div>

      <div class="modal-btns">
        <button class="btn-delete-modal" id="btn-delete-modal" onclick="deleteCurrentModalItem()">Eliminar</button>
        <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
        <button class="btn-action btn-primary" onclick="saveModalItem()">Guardar</button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_ITEMS = [
      // Almacén
      { id: '1', name: 'Pack Leche Larga Vida', detail: 'Caja x10 o x12 litros', cat: 'almacen', qty: 1, unitPrice: 0, checked: false },
      { id: '2', name: 'Fideos Guiseros / Tirabuzón', detail: 'Paquetes 500g (llevar 3 para precio x3)', cat: 'almacen', qty: 6, unitPrice: 0, checked: false },
      { id: '3', name: 'Fideos Largos / Tallarines', detail: 'Paquetes 500g', cat: 'almacen', qty: 3, unitPrice: 0, checked: false },
      { id: '4', name: 'Tuco en bolsita / sobrecito', detail: 'Tuco listo o pomarola', cat: 'almacen', qty: 6, unitPrice: 0, checked: false },
      { id: '5', name: 'Puré de Tomate común', detail: 'Tetra / sachet para estirar salsa', cat: 'almacen', qty: 4, unitPrice: 0, checked: false },
      { id: '6', name: 'Calditos de verdura', detail: 'Display x12 o x24 cubos', cat: 'almacen', qty: 1, unitPrice: 0, checked: false },
      { id: '7', name: 'Aceite de Girasol', detail: 'Botellas 900ml/1.5L o bidón 3L/5L', cat: 'almacen', qty: 3, unitPrice: 0, checked: false },
      { id: '8', name: 'Arroz Parboil', detail: 'Bolsa 1 kg (no se pasa)', cat: 'almacen', qty: 3, unitPrice: 0, checked: false },
      { id: '9', name: 'Harina 000', detail: 'Bolsa 1 kg', cat: 'almacen', qty: 3, unitPrice: 0, checked: false },
      { id: '10', name: 'Sal fina y gruesa', detail: '1 paquete de cada una', cat: 'almacen', qty: 2, unitPrice: 0, checked: false },

      // Conservas
      { id: '11', name: 'Arvejas en lata/tetra', detail: 'Proteína rápida económica', cat: 'conservas', qty: 4, unitPrice: 0, checked: false },
      { id: '12', name: 'Choclo (cremoso o grano)', detail: 'Latas para tartas/arroz', cat: 'conservas', qty: 3, unitPrice: 0, checked: false },
      { id: '13', name: 'Atún o Caballa', detail: 'Caballa rinde mucho más peso', cat: 'conservas', qty: 4, unitPrice: 0, checked: false },

      // Lácteos / Frescos
      { id: '14', name: 'Manteca (200g)', detail: 'Panes 200g (cortar y freezar 1)', cat: 'frescos', qty: 2, unitPrice: 0, checked: false },
      { id: '15', name: 'Queso Cremoso', detail: 'Trozo 1 kg si hay promo', cat: 'frescos', qty: 1, unitPrice: 0, checked: false },

      // Limpieza
      { id: '16', name: 'Jabón para ropa (líquido)', detail: 'Bidón 3L o 5L (Ala/Skip/Zorro)', cat: 'limpieza', qty: 1, unitPrice: 0, checked: false },
      { id: '17', name: 'Lavandina', detail: 'Bidón 4L o 5L', cat: 'limpieza', qty: 1, unitPrice: 0, checked: false },
      { id: '18', name: 'Detergente platos', detail: 'Botellas 750ml o bidón', cat: 'limpieza', qty: 2, unitPrice: 0, checked: false },
      { id: '19', name: 'Papel Higiénico', detail: 'Fardo 24 o 30 rollos', cat: 'limpieza', qty: 1, unitPrice: 0, checked: false },
      { id: '20', name: 'Rollos de cocina', detail: 'Pack x3 rollos', cat: 'limpieza', qty: 1, unitPrice: 0, checked: false },

      // Perfumería
      { id: '21', name: 'Champú familiar (750/930ml)', detail: 'Envase familiar Plusbelle/Suave', cat: 'perfumeria', qty: 2, unitPrice: 0, checked: false },
      { id: '22', name: 'Crema enjuague (750/930ml)', detail: 'Envase familiar', cat: 'perfumeria', qty: 2, unitPrice: 0, checked: false },
      { id: '23', name: 'Jabones de tocador', detail: 'Packs x3 panes', cat: 'perfumeria', qty: 2, unitPrice: 0, checked: false },
      { id: '24', name: 'Pasta dental', detail: 'Pomos grandes', cat: 'perfumeria', qty: 2, unitPrice: 0, checked: false },
      { id: '25', name: 'Desodorante corporal', detail: 'Roll-on o spray', cat: 'perfumeria', qty: 2, unitPrice: 0, checked: false }
    ];

    // Migration / Loading
    let items = JSON.parse(localStorage.getItem('vital_items_v2')) || DEFAULT_ITEMS;
    let budget = parseInt(localStorage.getItem('vital_budget_v2')) || 350000;
    let currentFilter = 'todos';

    function saveState() {
      localStorage.setItem('vital_items_v2', JSON.stringify(items));
      localStorage.setItem('vital_budget_v2', budget.toString());
      render();
    }

    function toggleCheck(id, event) {
      if (event) event.stopPropagation();
      const item = items.find(i => i.id === id);
      if (item) {
        item.checked = !item.checked;
        if (navigator.vibrate) navigator.vibrate(35);
        saveState();
      }
    }

    function changeQty(id, delta, event) {
      if (event) event.stopPropagation();
      const item = items.find(i => i.id === id);
      if (item) {
        item.qty = Math.max(1, (item.qty || 1) + delta);
        saveState();
      }
    }

    function updateUnitPrice(id, val, event) {
      if (event) event.stopPropagation();
      const item = items.find(i => i.id === id);
      if (item) {
        item.unitPrice = Math.max(0, parseInt(val) || 0);
        saveState();
      }
    }

    function editBudget() {
      const nuevo = prompt("Ingresá tu presupuesto total en pesos ($):", budget);
      if (nuevo && !isNaN(nuevo)) {
        budget = parseInt(nuevo);
        saveState();
      }
    }

    function filterCat(cat, btn) {
      currentFilter = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderList();
    }

    function formatMoney(num) {
      return "$" + (num || 0).toLocaleString("es-AR");
    }

    function render() {
      // Total calculate on CHECKED items with prices (items in cart)
      let totalSpent = 0;
      let checkedCount = 0;

      items.forEach(i => {
        const sub = (i.qty || 1) * (i.unitPrice || 0);
        if (i.checked) {
          totalSpent += sub;
          checkedCount++;
        }
      });

      const remaining = budget - totalSpent;

      document.getElementById('display-budget').innerText = formatMoney(budget) + " ✏️";
      document.getElementById('display-spent').innerText = formatMoney(totalSpent);
      
      const remainElem = document.getElementById('display-remain');
      remainElem.innerText = formatMoney(remaining);
      if (remaining < 0) {
        remainElem.classList.add('danger');
      } else {
        remainElem.classList.remove('danger');
      }

      document.getElementById('item-stats').innerText = `${checkedCount}/${items.length} en chango`;

      // Progress bar
      const pct = budget > 0 ? Math.min(100, Math.max(0, (totalSpent / budget) * 100)) : 0;
      const bar = document.getElementById('progress-bar');
      bar.style.width = pct + "%";
      bar.style.background = pct > 95 ? "var(--danger)" : (pct > 75 ? "var(--warning)" : "var(--primary)");

      renderList();
    }

    function renderList() {
      const container = document.getElementById('items-list');
      container.innerHTML = "";

      const filtered = currentFilter === 'todos' 
        ? items 
        : items.filter(i => i.cat === currentFilter);

      // Unchecked first, checked last
      filtered.sort((a, b) => (a.checked === b.checked ? 0 : a.checked ? 1 : -1));

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = `item-card ${item.checked ? 'checked' : ''}`;

        const subtotal = (item.qty || 1) * (item.unitPrice || 0);

        card.innerHTML = `
          <div class="card-top">
            <div class="custom-check" onclick="toggleCheck('${item.id}', event)">
              ${item.checked ? '✓' : ''}
            </div>
            <div class="item-title-box" onclick="toggleCheck('${item.id}', event)">
              <div class="item-name-row">
                <span class="item-name">${item.name}</span>
                <button class="btn-edit" onclick="openEditModal('${item.id}', event)">✏️ Editar</button>
              </div>
              <div class="item-sub">${item.detail || ''}</div>
            </div>
          </div>

          <!-- Price & Quantity Row -->
          <div class="calc-row" onclick="event.stopPropagation()">
            <div class="qty-control">
              <button class="btn-qty" onclick="changeQty('${item.id}', -1, event)">−</button>
              <span class="qty-display">${item.qty || 1} u.</span>
              <button class="btn-qty" onclick="changeQty('${item.id}', 1, event)">+</button>
            </div>

            <div class="unit-price-box">
              <label>c/u $</label>
              <input type="number" 
                     class="unit-input" 
                     placeholder="0" 
                     value="${item.unitPrice > 0 ? item.unitPrice : ''}" 
                     oninput="updateUnitPrice('${item.id}', this.value, event)">
            </div>

            <div class="subtotal-tag">
              ${subtotal > 0 ? '= ' + formatMoney(subtotal) : '$0'}
            </div>
          </div>
        `;

        container.appendChild(card);
      });
    }

    // Modal Sheet Handlers
    function openCreateModal() {
      document.getElementById('modal-title').innerText = "➕ Nuevo Producto";
      document.getElementById('modal-item-id').value = "";
      document.getElementById('modal-name').value = "";
      document.getElementById('modal-detail').value = "";
      document.getElementById('modal-qty').value = "1";
      document.getElementById('modal-price').value = "";
      document.getElementById('modal-cat').value = currentFilter === 'todos' ? 'almacen' : currentFilter;
      document.getElementById('btn-delete-modal').style.display = 'none';
      document.getElementById('item-modal').style.display = 'flex';
      document.getElementById('modal-name').focus();
    }

    function openEditModal(id, event) {
      if (event) event.stopPropagation();
      const item = items.find(i => i.id === id);
      if (!item) return;

      document.getElementById('modal-title').innerText = "✏️ Editar Producto";
      document.getElementById('modal-item-id').value = item.id;
      document.getElementById('modal-name').value = item.name;
      document.getElementById('modal-detail').value = item.detail || '';
      document.getElementById('modal-qty').value = item.qty || 1;
      document.getElementById('modal-price').value = item.unitPrice > 0 ? item.unitPrice : '';
      document.getElementById('modal-cat').value = item.cat || 'almacen';
      document.getElementById('btn-delete-modal').style.display = 'block';
      document.getElementById('item-modal').style.display = 'flex';
    }

    function closeModal(event) {
      if (event && event.target.id !== 'item-modal' && event.target.className !== 'btn-cancel') return;
      document.getElementById('item-modal').style.display = 'none';
    }

    function saveModalItem() {
      const id = document.getElementById('modal-item-id').value;
      const name = document.getElementById('modal-name').value.trim();
      const detail = document.getElementById('modal-detail').value.trim();
      const qty = Math.max(1, parseInt(document.getElementById('modal-qty').value) || 1);
      const unitPrice = Math.max(0, parseInt(document.getElementById('modal-price').value) || 0);
      const cat = document.getElementById('modal-cat').value;

      if (!name) {
        alert("Por favor poné un nombre al producto.");
        return;
      }

      if (id) {
        // Edit existing
        const item = items.find(i => i.id === id);
        if (item) {
          item.name = name;
          item.detail = detail;
          item.qty = qty;
          item.unitPrice = unitPrice;
          item.cat = cat;
        }
      } else {
        // Create new
        items.unshift({
          id: Date.now().toString(),
          name,
          detail,
          qty,
          unitPrice,
          cat,
          checked: false
        });
      }

      document.getElementById('item-modal').style.display = 'none';
      saveState();
    }

    function deleteCurrentModalItem() {
      const id = document.getElementById('modal-item-id').value;
      if (id && confirm("¿Borrar este producto de la lista?")) {
        items = items.filter(i => i.id !== id);
        document.getElementById('item-modal').style.display = 'none';
        saveState();
      }
    }

    // Share via WhatsApp
    function shareWhatsApp() {
      const pending = items.filter(i => !i.checked);
      const inCart = items.filter(i => i.checked);
      
      let totalSpent = 0;
      inCart.forEach(i => totalSpent += (i.qty || 1) * (i.unitPrice || 0));

      let msg = "🛒 *LISTA DE COMPRAS (VITAL/NINI)*\n";
      msg += `💰 *Presupuesto:* ${formatMoney(budget)} | *En chango:* ${formatMoney(totalSpent)}\n\n`;

      if (pending.length > 0) {
        msg += "⏳ *FALTAN COMPRAR:*\n";
        pending.forEach(i => {
          msg += `◻️ *${i.qty}u.* ${i.name} _(${i.detail || ''})_\n`;
        });
      }

      if (inCart.length > 0) {
        msg += "\n✅ *YA EN EL CHANGO:*\n";
        inCart.forEach(i => {
          const sub = (i.qty || 1) * (i.unitPrice || 0);
          const priceText = sub > 0 ? ` [${formatMoney(sub)}]` : '';
          msg += `✔️ *${i.qty}u.* ~${i.name}~${priceText}\n`;
        });
      }

      const encoded = encodeURIComponent(msg);
      window.open(`https://api.whatsapp.com/send?text=${encoded}`, '_blank');
    }

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js?v=2')
        .then(() => console.log("SW v2 activo"))
        .catch(err => console.log("SW error", err));
    }

    // Initial render
    render();
  </script>
</body>
</html>
